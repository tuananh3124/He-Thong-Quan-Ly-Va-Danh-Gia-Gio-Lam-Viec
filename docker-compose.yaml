services:
  nest_postgres_dev:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=projectname
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - 'postgres_data:/var/lib/postgresql/data/pgdata'
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d projectname']
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer
    restart: always
    depends_on:
      - nest_postgres_dev
    ports:
      - '6432:6432'
    volumes:
      - ./backend/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./backend/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt

  redis_dev:
    restart: always
    image: redis:alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
